function html(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text != null) element.textContent = text;
  return element;
}

function svgElement(tag, attributes = {}) {
  const element = document.createElementNS(SVG_NS, tag);
  Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, String(value)));
  return element;
}

function local(value, lang, fallback = '') {
  if (typeof value === 'string') return value;
  return value?.[lang] || value?.en || value?.ko || fallback;
}

function wrapLabel(value, maxLength, maxLines) {
  const words = String(value || '').split(/\s+/);
  const lines = [];
  let current = '';
  words.forEach(word => {
    if (current && `${current} ${word}`.length > maxLength) {
      lines.push(current);
      current = word;
    } else current += `${current ? ' ' : ''}${word}`;
  });
  if (current) lines.push(current);
  if (lines.length > maxLines) {
    lines.length = maxLines;
    lines[maxLines - 1] = `${lines[maxLines - 1].slice(0, maxLength - 1).trimEnd()}…`;
  }
  return lines;
}

function textLines(parent, text, x, y, { maxLength = 30, maxLines = 2, lineHeight = 17, className = '', anchor = 'start' } = {}) {
  const element = svgElement('text', { x, y, 'text-anchor': anchor, class: className });
  wrapLabel(text, maxLength, maxLines).forEach((line, index) => {
    const span = svgElement('tspan', { x, dy: index ? lineHeight : 0 });
    span.textContent = line;
    element.append(span);
  });
  parent.append(element);
  return element;
}

function render(){graph?.destroy();graph=null;document.documentElement.lang=state.lang;document.title=t('Semantic ID Atlas — Relation Map','Semantic ID Atlas — 관계 지도');$('#app').innerHTML=`<header class="map-header"><a class="map-brand" href="${esc(location.pathname)}"><span class="map-mark">${icon('graph',23)}</span><span>Semantic ID <strong>Atlas</strong><small>${t('RESEARCH RELATION MAP','연구 관계 지도')}</small></span></a><div class="map-header-actions">${link(meta.repoUrl,`GitHub ${icon('external',14)}`,'map-source')}<button class="secondary-button map-share" data-action="share" aria-label="Copy a link to this map">${icon('copy',14)}<span>${t('Share map','지도 공유')}</span></button></div></header><main id="main" class="map-only" tabindex="-1"><section class="map-intro"><div><p class="map-eyebrow">${t('FOLLOW THE IDEAS','아이디어의 연결을 따라가다')}</p><h1>${t('A map of Semantic ID research.','Semantic ID 연구를 한눈에.')}</h1><p>${t('Choose a research category. Follow an application context. Open a paper to go deeper.','연구 분류를 선택하고, 활용 분야를 따라가세요. 논문을 열어 아이디어를 더 깊이 살펴보세요.')}</p></div><div class="map-stats"><span><strong>${papers.length}</strong> ${t('papers','논문')}</span><span><strong>${categories.length}</strong> ${t('categories','분류')}</span><small>${t('Snapshot','스냅샷')} ${esc(meta.snapshotDate)}</small></div></section><section class="map-filterbar" aria-label="${t('Map controls','지도 탐색 도구')}"><label class="search-wrap">${icon('search',16)}<input id="map-search" type="search" value="${esc(state.query)}" placeholder="${t('Find a paper, method, or keyword…','논문, 방법, 키워드 검색…')}" aria-label="${t('Search papers','논문 검색')}" autocomplete="off"><span class="search-key" aria-hidden="true">/</span></label><label class="map-select"><span>${t('Category','분류')}</span><select id="map-category" aria-label="${t('Expand a research category','연구 분류 펼치기')}">${categories.map(c=>`<option value="${esc(c.id)}" ${state.category===c.id?'selected':''}>${esc(cat(c))}</option>`).join('')}</select></label><label class="filter-check"><input id="map-code" type="checkbox" ${state.code?'checked':''}>${t('With code','코드 공개')}</label><button class="map-reset" data-action="reset">${t('Reset','초기화')}</button></section><div id="map-feedback" class="map-feedback" role="status" aria-live="polite"></div><div id="map-canvas"></div><footer class="map-foot"><p>${t('Paper titles, links, and category membership come from','논문 제목·링크·분류 출처:')} ${link(meta.repoUrl,'awesome-semantic-id')}. ${t('Application connections and reading notes are editorial.','활용 분야 연결과 이중 언어 읽기 가이드는 편집 내용입니다.')}</p><div><a href="https://github.com/semantic-id-tutorial/awesome-semantic-id/blob/main/README.md" target="_blank" rel="noopener noreferrer">${t('Source README','원본 README')}</a><a href="https://github.com/semantic-id-tutorial/awesome-semantic-id/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">${t('License','라이선스')}</a><span>${esc(meta.snapshotDate)} · ${esc(String(meta.commit||'').slice(0,7))}${meta.dirty?t(' + local updates',' + 로컬 업데이트'):''}</span></div></footer></main>`;mount();}
function mount(choose=false){const available=eligible(),matches=available.filter(matching);if(choose&&matches.length&&!matches.some(p=>p.category===state.category))state.category=matches[0].category;$('#map-category').value=state.category;$('#map-feedback').innerHTML=state.query.trim()?`<span><strong>${matches.length}</strong> ${t('matching papers across','검색 일치 논문 ·')} <strong>${new Set(matches.map(p=>p.category)).size}</strong> ${t('categories','분류')}</span><span>${t('Matching nodes are highlighted; select a category to inspect them.','일치하는 논문을 강조합니다. 분류를 선택해 살펴보세요.')}</span>`:`<span><strong>${available.length}</strong> ${t('papers available','편의 논문')}${state.code?' · '+t('code links only','코드 링크가 있는 논문'):''}</span><span>${t('Select a paper for a reading guide and original links.','논문을 선택하면 읽기 가이드와 원본 링크를 볼 수 있습니다.')}</span>`;graph?.destroy();graph=mountGraph($('#map-canvas'),{categories,papers:available,useCases,lang:state.lang,query:state.query,filterCategory:state.category,onSelectPaper:p=>openPaper(p.id),onSelectCategory:id=>{state.category=id;$('#map-category').value=id;writeHash();}});writeHash();}
async function share(){writeHash();try{await navigator.clipboard.writeText(location.href);toast(t('Link copied — it opens this topic and search.','현재 언어·분류·검색을 여는 링크를 복사했습니다.'));}catch{const e=document.createElement('textarea');e.value=location.href;e.style.cssText='position:fixed;left:-10000px';document.body.append(e);e.select();const ok=document.execCommand('copy');e.remove();toast(ok?t('Map link copied.','지도 링크를 복사했습니다.'):t('Copy the browser address to share this view.','브라우저 주소를 복사하면 현재 지도를 공유할 수 있습니다.'));}}
document.addEventListener('click',event=>{if(event.target.matches('[data-close-backdrop]')){closePaper();return;}const e=event.target.closest('button');if(!e)return;if(e.dataset.paper){openPaper(e.dataset.paper);return;}if(e.dataset.lang){state.lang=e.dataset.lang;writeHash();render();$(`[data-lang="${state.lang}"]`)?.focus();return;}if(e.dataset.action==='close-dialog')closePaper();if(e.dataset.action==='share')share();if(e.dataset.action==='reset'){Object.assign(state,{category:defaultCategory,query:'',code:false});render();$('#map-search')?.focus();}});
document.addEventListener('input',event=>{if(event.target.id==='map-search'){state.query=event.target.value;mount(true);}});
document.addEventListener('change',event=>{if(event.target.id==='map-category'){state.category=event.target.value;mount();}if(event.target.id==='map-code'){state.code=event.target.checked;mount(true);}});
document.addEventListener('keydown',event=>{if(dialogPaper){if(event.key==='Escape'){event.preventDefault();closePaper();return;}if(event.key==='Tab'){const d=$('.paper-dialog'),nodes=[...d.querySelectorAll('a[href],button:not([disabled]),[tabindex="0"]')].filter(e=>e.getClientRects().length),first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement===d)){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}return;}if(event.key==='/'&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&!event.target.matches('input,textarea,select,[contenteditable="true"]')){event.preventDefault();$('#map-search')?.focus();}});
window.addEventListener('hashchange',()=>{closePaper();state=readHash();render();});
render();
</script></body></html>
